plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
}

sourceSets {
	// 先声明存在（classpath 依赖 client 源集，须在 loom 块之后再补）
	testmod
}

loom {
	splitEnvironmentSourceSets()

	runs {
		client {
			// 开发验证：离线用户名 + 自动连接本地服务器（27.0 起需配合 server.properties 关闭正版/白名单）
			programArgs '--username', 'TestPlayer'
			programArgs '--server', '127.0.0.1'
			programArgs '--port', '25565'
		}

		gametest {
			// 服务端 gametest（无头）：gradlew runGametest
			server()
			configName = "Game Test"
			source sourceSets.testmod
			property "fabric-api.gametest", "true"
			property "fabric-api.gametest.report-file",
					"${project.layout.buildDirectory.get().asFile}/gametest.xml"
			runDir "run-gametest"
		}
	}

	mods {
		// 名称须与 fabric.mod.json 的 id 一致（buildmart）
		"buildmart" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
		// 测试 mod（仅开发/测试环境加载，不进发布 jar）
		"buildmart-testmod" {
			sourceSet sourceSets.testmod
		}
	}
}

// 注意：须放在 loom 块之后 —— splitEnvironmentSourceSets() 才会创建 client 源集
sourceSets {
	// 测试专用源集：gametest 用例与测试 API（独立 mod id buildmart-testmod），
	// 不参与发布 jar —— 见 src/testmod/resources/fabric.mod.json。
	// 类路径直接继承 main 的 compile/runtime classpath（Loom 的 minecraft 配置只自动接给
	// main/client 源集，自定义源集须手动继承才能看到 MC 类）。
	testmod {
		compileClasspath += sourceSets.main.compileClasspath
		compileClasspath += sourceSets.main.output + sourceSets.client.output
		runtimeClasspath += sourceSets.main.runtimeClasspath
		runtimeClasspath += sourceSets.main.output + sourceSets.client.output
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// SQLite JDBC driver for the economy storage; bundled into the mod jar.
	// slf4j-api is excluded from the bundle because Minecraft/Fabric Loader already provide it.
	implementation "org.xerial:sqlite-jdbc:${project.sqlite_jdbc_version}"
	include("org.xerial:sqlite-jdbc:${project.sqlite_jdbc_version}") {
		exclude group: "org.slf4j", module: "slf4j-api"
	}
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	// 产物命名：buildmart-游戏版本-fabric-mod版本.jar（如 buildmart-26.2-fabric-7.0.jar）
	archiveFileName = "buildmart-${project.minecraft_version}-fabric-${project.version}.jar"

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// 源码包同样按新命名规则（-sources 后缀）
tasks.named("sourcesJar") {
	archiveFileName = "buildmart-${project.minecraft_version}-fabric-${project.version}-sources.jar"
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
